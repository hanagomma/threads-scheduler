name: Refresh Threads token

on:
  schedule:
    - cron: "17 1 1,15 * *"   # 매달 1일·15일 (토큰 60일 만료 전에 연장)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Refresh and store new token
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # repo secrets 쓰기 권한이 있는 토큰
        run: |
          NEW=$(python scripts/refresh_token.py)
          echo "::add-mask::$NEW"
          gh secret set THREADS_ACCESS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
